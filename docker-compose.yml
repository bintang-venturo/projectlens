services:

  postgres:
    image: postgres:16
    container_name: projectlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pdf_rag
      POSTGRES_USER: pdf_rag
      POSTGRES_PASSWORD: pdf_rag
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdf_rag -d pdf_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: projectlens-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  chromadb:
    image: chromadb/chroma:latest
    container_name: projectlens-chromadb
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data

volumes:
  postgres_data:
  redis_data:
  chroma_data:
