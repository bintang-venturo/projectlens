[project]
name = "projectlens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bintang Romadhon", email = "bintang.arema@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "chromadb>=1.5.9",
    "django>=6.1",
    "djangorestframework>=3.18.0",
    "google-genai>=2.21.0",
    "langchain-text-splitters>=0.3.8",
    "psycopg[binary]>=3.3.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "apps", "core"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]
